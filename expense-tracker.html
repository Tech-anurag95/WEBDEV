<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Personal Expense Tracker</h1>
            <p>Take control of your finances and track every penny</p>
        </div>

        <div class="main-content">
            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="card income">
                    <h3>Total Income</h3>
                    <div class="amount" id="totalIncome">₹0.00</div>
                </div>
                <div class="card expense">
                    <h3>Total Expenses</h3>
                    <div class="amount" id="totalExpense">₹0.00</div>
                </div>
                <div class="card balance">
                    <h3>Net Balance</h3>
                    <div class="amount" id="netBalance">₹0.00</div>
                </div>
            </div>

            <!-- Transaction Form -->
            <div class="form-section">
                <h2>Add New Transaction</h2>
                
                <div class="error-message" id="errorMessage"></div>
                <div class="success-message" id="successMessage"></div>

                <form id="transactionForm">
                    <div class="transaction-type">
                        <button type="button" class="type-btn income active" id="incomeBtn">
                            📈 Income
                        </button>
                        <button type="button" class="type-btn expense" id="expenseBtn">
                            📉 Expense
                        </button>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <input type="text" id="description" placeholder="Enter description" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" required>
                                <option value="">Select Category</option>
                                <!-- Options will be populated by JavaScript -->
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="amount">Amount (₹)</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0" required>
                        </div>
                    </div>

                    <button type="submit" class="add-btn">Add Transaction</button>
                </form>
            </div>

            <!-- Transactions List -->
            <div class="transactions-section">
                <div class="transactions-header">
                    <h2>Recent Transactions</h2>
                    <button class="clear-all-btn" id="clearAllBtn">Clear All</button>
                </div>
                <div class="transaction-list" id="transactionList">
                    <div class="no-transactions" id="noTransactions">
                        <h3>📊 No Transactions Yet</h3>
                        <p>Start by adding your first income or expense above</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
